<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Médicos Recomendados</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        },
                        medical: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full text-slate-800 antialiased font-sans flex flex-col selection:bg-teal-500 selection:text-white">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-teal-700 via-medical-600 to-medical-700 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-white/10 backdrop-blur-md rounded-xl border border-white/20">
                        <i class="fa-solid fa-user-doctor text-2xl sm:text-3xl text-teal-200"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Directorio Médico Interactivo</h1>
                        <p class="text-xs sm:text-sm text-teal-100/90 font-light">Guía de especialistas y profesionales recomendados</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 self-end md:self-auto">
                    <button onclick="openAddModal()" class="inline-flex items-center gap-2 bg-teal-500 hover:bg-teal-400 text-white font-medium text-sm px-3.5 py-2 rounded-lg shadow-sm transition-all duration-150 active:scale-95">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Agregar Médico</span>
                    </button>
                    
                    <!-- Dropdown for Data Management -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDataMenu()" id="dataMenuBtn" class="p-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors border border-white/20" title="Gestión de Datos">
                            <i class="fa-solid fa-arrows-rotate text-sm"></i>
                        </button>
                        <div id="dataMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 z-50 text-slate-700 py-1 text-sm">
                            <button onclick="exportJSON()" class="w-full text-left px-4 py-2 hover:bg-slate-50 flex items-center gap-2">
                                <i class="fa-solid fa-file-code text-teal-600"></i> Exportar JSON
                            </button>
                            <button onclick="exportCSV()" class="w-full text-left px-4 py-2 hover:bg-slate-50 flex items-center gap-2">
                                <i class="fa-solid fa-file-csv text-green-600"></i> Exportar a Excel/CSV
                            </button>
                            <label class="w-full text-left px-4 py-2 hover:bg-slate-50 flex items-center gap-2 cursor-pointer">
                                <i class="fa-solid fa-file-import text-medical-600"></i> Importar Backup
                                <input type="file" id="importFileInput" onchange="importJSON(event)" class="hidden" accept=".json">
                            </label>
                            <hr class="my-1 border-slate-100">
                            <button onclick="resetData()" class="w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2">
                                <i class="fa-solid fa-rotate-left"></i> Restaurar Lista Original
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Search & Filters Panel -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-5">
            <div class="space-y-4">
                
                <!-- Main Search Bar -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                    </div>
                    <input type="text" id="searchInput" oninput="applyFilters()" 
                           placeholder="Buscar por nombre, especialidad, clínica, barrio o nota..." 
                           class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white transition-all">
                    <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>

                <!-- Dropdowns & Toggles Container -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    
                    <!-- Specialty Filter -->
                    <div>
                        <label for="specialtyFilter" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Especialidad</label>
                        <select id="specialtyFilter" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-xs sm:text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white">
                            <option value="">Todas las Especialidades</option>
                        </select>
                    </div>

                    <!-- Zone Filter -->
                    <div>
                        <label for="zoneFilter" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Barrio / Zona</label>
                        <select id="zoneFilter" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-xs sm:text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white">
                            <option value="">Todas las Zonas</option>
                        </select>
                    </div>

                    <!-- Institution Filter -->
                    <div>
                        <label for="institutionFilter" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Lugar / Institución</label>
                        <select id="institutionFilter" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-xs sm:text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white">
                            <option value="">Cualquier Lugar / Sanatorio</option>
                        </select>
                    </div>

                    <!-- Filter Toggles -->
                    <div class="flex items-end gap-2 pt-2 sm:pt-0">
                        <!-- PAMI Toggle -->
                        <button id="pamiToggle" onclick="toggleFilter('pami')" 
                                class="flex-1 py-2 px-3 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 select-none">
                            <i class="fa-solid fa-id-card"></i>
                            <span>PAMI</span>
                        </button>

                        <!-- Domicilio Toggle -->
                        <button id="domicilioToggle" onclick="toggleFilter('domicilio')" 
                                class="flex-1 py-2 px-3 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 text-xs sm:text-sm font-medium transition-all flex items-center justify-center gap-1.5 select-none">
                            <i class="fa-solid fa-house-medical"></i>
                            <span>Domicilio</span>
                        </button>
                    </div>

                </div>

                <!-- Active Filters & Counter Row -->
                <div class="flex flex-wrap items-center justify-between border-t border-slate-100 pt-3 gap-2 text-xs sm:text-sm text-slate-500">
                    <div id="resultsCount" class="font-medium text-slate-700">
                        Cargando catálogo...
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="resetAllFilters()" class="text-teal-600 hover:text-teal-700 font-medium hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-rotate-left text-xs"></i> Limpiar Filtros
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- Doctor Cards Grid -->
        <section id="doctorsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Cards rendered dynamically via JS -->
        </section>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 px-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm">
            <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-user-slash"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">No se encontraron profesionales</h3>
            <p class="text-slate-500 text-sm max-w-md mx-auto mb-6">Prueba cambiando la búsqueda o quitando algunos de los filtros seleccionados.</p>
            <button onclick="resetAllFilters()" class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                Restablecer Filtros
            </button>
        </div>

    </main>

    <!-- Modal: Add / Edit Doctor -->
    <div id="doctorModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-xl overflow-hidden my-8 transform transition-all">
            
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-teal-600"></i> Agregar Nuevo Profesional
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="doctorForm" onsubmit="saveDoctor(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
                <input type="hidden" id="doctorId">

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nombre y Apellido *</label>
                    <input type="text" id="formName" required placeholder="Ej. Dr. Juan Pérez" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Especialidad principal *</label>
                        <input type="text" id="formSpecialty" required placeholder="Ej. Neurología, Kinesiología" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Barrio / Zona</label>
                        <input type="text" id="formZone" placeholder="Ej. Recoleta, San Isidro, CABA" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Lugar de Atención / Sanatorio</label>
                    <input type="text" id="formLocation" placeholder="Ej. Hospital Italiano, Fleni, Consultorio Privado" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Teléfono principal</label>
                        <input type="text" id="formPhone" placeholder="Ej. 54 11 4959-0300" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Teléfono secundario / Whatsapp</label>
                        <input type="text" id="formPhone2" placeholder="Ej. 54 9 11 6159-5361" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Dirección / Dirección Web</label>
                    <input type="text" id="formAddress" placeholder="Ej. Av. Santa Fe 2245 1° o www.sitio.com" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none">
                </div>

                <!-- Toggles / Checks -->
                <div class="flex flex-wrap gap-4 py-2 border-y border-slate-100">
                    <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700">
                        <input type="checkbox" id="formPami" class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
                        <span>Acepta PAMI</span>
                    </label>
                    <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700">
                        <input type="checkbox" id="formDomicilio" class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
                        <span>Atiende a Domicilio</span>
                    </label>
                    <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700">
                        <input type="checkbox" id="formVirtual" class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
                        <span>Consultas Virtuales</span>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Notas / Recomendaciones</label>
                    <textarea id="formNotes" rows="3" placeholder="Información de experiencia, referencias, subespecialidades..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:bg-white outline-none"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-lg text-slate-600 text-sm font-medium transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-medium shadow-sm transition-colors">
                        Guardar Médico
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-teal-400"></i>
        <span id="toastMsg">Mensaje de notificación</span>
    </div>

        // Global State Variable
        let doctorsData = [];
        let activeFilters = {
            pami: false,
            domicilio: false
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadInitialData();
            populateFilterOptions();
            applyFilters();
            
            // Close dropdowns on outside click
            window.addEventListener('click', (e) => {
                const btn = document.getElementById('dataMenuBtn');
                const menu = document.getElementById('dataMenu');
                if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.add('hidden');
                }
            });
        });

        // Load data from LocalStorage or Fallback to Default
        function loadInitialData() {
            const stored = localStorage.getItem('recommended_doctors_db');
            if (stored) {
                try {
                    doctorsData = JSON.parse(stored);
                } catch(e) {
                    console.error("Error reading localStorage, resetting to default.", e);
                    doctorsData = [...INITIAL_DOCTORS];
                }
            } else {
                doctorsData = [...INITIAL_DOCTORS];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('recommended_doctors_db', JSON.stringify(doctorsData));
        }

        // Dynamically Populate Filter Dropdowns
        function populateFilterOptions() {
            const specialtySelect = document.getElementById('specialtyFilter');
            const zoneSelect = document.getElementById('zoneFilter');
            const institutionSelect = document.getElementById('institutionFilter');

            // Collect unique values
            const specialties = new Set();
            const zones = new Set();
            const institutions = new Set();

            doctorsData.forEach(d => {
                if(d.specialty) specialties.add(d.specialty.trim());
                if(d.zone) {
                    d.zone.split(/[,/]/).forEach(z => {
                        if(z.trim()) zones.add(z.trim());
                    });
                }
                if(d.location) {
                    d.location.split(/[,/]/).forEach(i => {
                        if(i.trim()) institutions.add(i.trim());
                    });
                }
            });

            // Populate Specialty
            specialtySelect.innerHTML = '<option value="">Todas las Especialidades</option>';
            Array.from(specialties).sort().forEach(s => {
                specialtySelect.innerHTML += `<option value="${s}">${s}</option>`;
            });

            // Populate Zone
            zoneSelect.innerHTML = '<option value="">Todas las Zonas</option>';
            Array.from(zones).sort().forEach(z => {
                zoneSelect.innerHTML += `<option value="${z}">${z}</option>`;
            });

            // Populate Institutions
            institutionSelect.innerHTML = '<option value="">Cualquier Lugar / Sanatorio</option>';
            Array.from(institutions).sort().forEach(inst => {
                institutionSelect.innerHTML += `<option value="${inst}">${inst}</option>`;
            });
        }

        // Main Search & Filter Logic
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const specialtyVal = document.getElementById('specialtyFilter').value;
            const zoneVal = document.getElementById('zoneFilter').value;
            const instVal = document.getElementById('institutionFilter').value;
            const clearBtn = document.getElementById('clearSearchBtn');

            if(query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const filtered = doctorsData.filter(d => {
                // Text search
                const matchQuery = !query || 
                    d.name.toLowerCase().includes(query) ||
                    d.specialty.toLowerCase().includes(query) ||
                    d.zone.toLowerCase().includes(query) ||
                    d.location.toLowerCase().includes(query) ||
                    d.notes.toLowerCase().includes(query) ||
                    d.address.toLowerCase().includes(query);

                // Select filters
                const matchSpecialty = !specialtyVal || d.specialty === specialtyVal;
                const matchZone = !zoneVal || d.zone.includes(zoneVal);
                const matchInst = !instVal || d.location.includes(instVal);

                // Toggles
                const matchPami = !activeFilters.pami || d.pami;
                const matchDomicilio = !activeFilters.domicilio || d.domicilio;

                return matchQuery && matchSpecialty && matchZone && matchInst && matchPami && matchDomicilio;
            });

            renderCards(filtered);
            updateCounter(filtered.length, doctorsData.length);
        }

        // Toggle Filter Buttons
        function toggleFilter(type) {
            activeFilters[type] = !activeFilters[type];
            const btn = document.getElementById(`${type}Toggle`);

            if (activeFilters[type]) {
                btn.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200');
                btn.classList.add('bg-teal-600', 'text-white', 'border-teal-600', 'shadow-sm');
            } else {
                btn.classList.remove('bg-teal-600', 'text-white', 'border-teal-600', 'shadow-sm');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
            }

            applyFilters();
        }

        // Reset All Filters
        function resetAllFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('specialtyFilter').value = '';
            document.getElementById('zoneFilter').value = '';
            document.getElementById('institutionFilter').value = '';

            activeFilters.pami = false;
            activeFilters.domicilio = false;

            ['pamiToggle', 'domicilioToggle'].forEach(id => {
                const btn = document.getElementById(id);
                btn.classList.remove('bg-teal-600', 'text-white', 'border-teal-600', 'shadow-sm');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
            });

            applyFilters();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        function updateCounter(showing, total) {
            document.getElementById('resultsCount').innerHTML = `Mostrando <span class="font-bold text-teal-700">${showing}</span> de ${total} profesionales`;
        }

        // Modal Controls
        function openAddModal() {
            document.getElementById('doctorId').value = '';
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-plus text-teal-600"></i> Agregar Nuevo Profesional';
            document.getElementById('doctorForm').reset();
            document.getElementById('doctorModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const doc = doctorsData.find(d => d.id === id);
            if (!doc) return;

            document.getElementById('doctorId').value = doc.id;
            document.getElementById('modalTitle').innerHTML = '<i class="fa-regular fa-pen-to-square text-teal-600"></i> Editar Profesional';
            
            document.getElementById('formName').value = doc.name || '';
            document.getElementById('formSpecialty').value = doc.specialty || '';
            document.getElementById('formZone').value = doc.zone || '';
            document.getElementById('formLocation').value = doc.location || '';
            document.getElementById('formPhone').value = doc.phone || '';
            document.getElementById('formPhone2').value = doc.phone2 || '';
            document.getElementById('formAddress').value = doc.address || '';
            document.getElementById('formPami').checked = doc.pami || false;
            document.getElementById('formDomicilio').checked = doc.domicilio || false;
            document.getElementById('formVirtual').checked = doc.virtual || false;
            document.getElementById('formNotes').value = doc.notes || '';

            document.getElementById('doctorModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('doctorModal').classList.add('hidden');
        }

        // Save Doctor Form Submit
        function saveDoctor(e) {
            e.preventDefault();

            const id = document.getElementById('doctorId').value;
            const newDoc = {
                id: id ? id : Date.now().toString(),
                name: document.getElementById('formName').value.trim(),
                specialty: document.getElementById('formSpecialty').value.trim(),
                zone: document.getElementById('formZone').value.trim(),
                location: document.getElementById('formLocation').value.trim(),
                phone: document.getElementById('formPhone').value.trim(),
                phone2: document.getElementById('formPhone2').value.trim(),
                address: document.getElementById('formAddress').value.trim(),
                pami: document.getElementById('formPami').checked,
                domicilio: document.getElementById('formDomicilio').checked,
                virtual: document.getElementById('formVirtual').checked,
                notes: document.getElementById('formNotes').value.trim()
            };

            if (id) {
                // Update existing
                const index = doctorsData.findIndex(d => d.id === id);
                if (index !== -1) doctorsData[index] = newDoc;
                showToast('Profesional actualizado correctamente');
            } else {
                // Add new
                doctorsData.unshift(newDoc);
                showToast('Nuevo profesional agregado');
            }

            saveToLocalStorage();
            populateFilterOptions();
            applyFilters();
            closeModal();
        }

        // Delete Doctor
        function deleteDoctor(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este profesional?')) {
                doctorsData = doctorsData.filter(d => d.id !== id);
                saveToLocalStorage();
                populateFilterOptions();
                applyFilters();
                showToast('Profesional eliminado');
            }
        }

        // Backup / Data Management
        function toggleDataMenu() {
            document.getElementById('dataMenu').classList.toggle('hidden');
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(doctorsData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `medicos_recomendados_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('Backup exportado como JSON');
        }

        function exportCSV() {
            if (doctorsData.length === 0) return;
            
            const headers = ["Nombre", "Especialidad", "Barrio/Zona", "Lugar/Sanatorio", "Telefono 1", "Telefono 2", "Direccion", "PAMI", "Domicilio", "Virtual", "Notas"];
            const rows = doctorsData.map(d => [
                `"${(d.name || '').replace(/"/g, '""')}"`,
                `"${(d.specialty || '').replace(/"/g, '""')}"`,
                `"${(d.zone || '').replace(/"/g, '""')}"`,
                `"${(d.location || '').replace(/"/g, '""')}"`,
                `"${(d.phone || '').replace(/"/g, '""')}"`,
                `"${(d.phone2 || '').replace(/"/g, '""')}"`,
                `"${(d.address || '').replace(/"/g, '""')}"`,
                d.pami ? "SI" : "NO",
                d.domicilio ? "SI" : "NO",
                d.virtual ? "SI" : "NO",
                `"${(d.notes || '').replace(/"/g, '""')}"`
            ]);

            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `medicos_recomendados_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
            showToast('Archivo CSV descargado');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        doctorsData = imported;
                        saveToLocalStorage();
                        populateFilterOptions();
                        applyFilters();
                        showToast('Base de datos importada exitosamente');
                    } else {
                        alert('El archivo JSON no tiene un formato válido.');
                    }
                } catch(err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm('¿Restaurar la lista original de médicos descartando los cambios locales?')) {
                doctorsData = [...INITIAL_DOCTORS];
                saveToLocalStorage();
                populateFilterOptions();
                applyFilters();
                showToast('Lista restaurada al estado inicial');
            }
        }

        // Helper: Toast Notifications
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Helper: Sanitize HTML strings
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
