<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La próxima estación</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2a33;--mut:#6d6a76;--acc:#c2542d;--acc2:#2f6f6a;--line:#e3dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b21;--card:#26252d;--ink:#f0ecf5;--mut:#a9a5b3;--acc:#f08a5d;--acc2:#6fc2ba;--line:#3a3944}}
:root[data-theme="dark"]{--bg:#1c1b21;--card:#26252d;--ink:#f0ecf5;--mut:#a9a5b3;--acc:#f08a5d;--acc2:#6fc2ba;--line:#3a3944}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:1.9rem;margin:.2em 0 0}
.sub{color:var(--mut);margin:.2em 0 1em;font-family:system-ui,sans-serif;font-size:.95rem}
.track{display:flex;align-items:center;margin:18px 0 22px;font-family:system-ui,sans-serif;font-size:.8rem}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;width:64px;text-align:center;color:var(--mut)}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;font-size:.75rem}
.stop.on{color:var(--ink);font-weight:600}.stop.on .dot{border-color:var(--acc);background:var(--acc);color:#fff}
.stop.done .dot{border-color:var(--acc2);background:var(--acc2);color:#fff}
.rail{flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:0 2px 0 var(--line)}
.tag{font-family:system-ui,sans-serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700}
h2{margin:.3em 0 .5em;font-size:1.4rem;line-height:1.3}
textarea{width:100%;min-height:110px;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:600 1rem system-ui,sans-serif;padding:12px 18px;border-radius:999px;border:2px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.opt{background:var(--bg);color:var(--ink);border-color:var(--line);flex:1;min-width:150px}
button.opt:hover{border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.situ{font-size:1.25rem;font-style:italic;margin:.2em 0 .4em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{font-family:system-ui,sans-serif;font-size:.85rem;padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.chip.s{border-color:var(--acc2);color:var(--acc2)}.chip.q{border-color:var(--acc)}
h3{font:700 .8rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 0 4px}
.terr{border-left:4px solid var(--acc2);padding:4px 0 4px 14px;margin:14px 0}
.terr b{font-size:1.1rem}
.note{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut);margin-top:12px}
.lv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:.95rem}.pts{color:var(--acc2);white-space:pre}
.prog{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>La próxima estación</h1>
<p class="sub">Un recorrido para explorar qué podés hacer con todo lo que ya construiste. No hay respuestas correctas ni un destino fijo.</p>
<div class="track" id="track"></div>
<div id="stage"></div>
</main>
<script>
const QS=[
 {k:"saberes",t:"¿Qué te consultan otros porque “vos de esto sabés”?"},
 {k:"saberes",t:"¿Qué problema sabés resolver casi sin darte cuenta?"},
 {k:"energias",t:"¿Qué parte de tu trabajo te gustaría conservar, la que te da energía?"},
 {k:"basta",t:"¿Qué parte de tu trabajo ya no querés seguir haciendo?"}
];
const SK={escuchar:"Escucha y empatía",ensenar:"Enseñar y transmitir",ordenar:"Ordenar y sistematizar",facilitar:"Facilitar acuerdos",acompanar:"Acompañar y mentorear",actuar:"Tomar la iniciativa"};
const CARDS=[
 {t:"Una compañera nueva lleva dos semanas y todavía no entiende cómo funcionan realmente las cosas.",o:[["Me siento con ella y le cuento lo que no está escrito en ningún manual.","ensenar"],["Le digo que puede preguntarme lo que sea, y la invito a un café para conocernos.","acompanar"],["Armo una guía de una página con las reglas no escritas, para ella y para quien llegue después.","ordenar"]]},
 {t:"Un equipo está trabado porque nadie logra ponerse de acuerdo.",o:[["Propongo que cada uno diga qué necesita de verdad antes de discutir soluciones.","facilitar"],["Hablo con cada persona por separado para entender qué hay detrás.","escuchar"],["Pongo sobre la mesa una propuesta razonable para destrabar.","actuar"]]},
 {t:"Tenés que explicar algo muy complejo a personas que no son del tema.",o:[["Busco un ejemplo cotidiano que lo haga tangible.","ensenar"],["Lo divido en pasos y armo un esquema simple.","ordenar"],["Pregunto qué parte les resulta confusa y arranco desde ahí.","escuchar"]]},
 {t:"Un cliente está muy enojado y hay que reconstruir la relación.",o:[["Lo dejo descargarse y le confirmo que entiendo cuál es el problema.","escuchar"],["Resuelvo hoy lo que se pueda y le aviso cada avance.","actuar"],["Reúno a las partes para acordar una salida que a todos les sirva.","facilitar"]]},
 {t:"Nadie documentó un proceso importante y todo depende de la memoria de una sola persona.",o:[["Lo escribo yo, paso a paso, para que no dependa de nadie.","ordenar"],["Me siento con esa persona y la acompaño a transmitirlo a su modo.","acompanar"],["Empiezo a hacerlo con ella y lo voy documentando sobre la marcha.","actuar"]]},
 {t:"Alguien más joven necesita criterio para tomar una decisión y no tiene con quién conversarla.",o:[["Le hago preguntas para que llegue a su propia decisión.","acompanar"],["Le cuento una situación parecida que viví y qué aprendí de ella.","ensenar"],["Le ayudo a poner en una hoja pros, contras y riesgos.","ordenar"]]}
];
const S={step:0,q:0,ans:{saberes:[],energias:[],basta:[]},c:0,picks:[],lim:{tiempo:"",dinero:"",contexto:""},ai:null};
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){x==="class"?e.className=a[x]:x==="onclick"?e.onclick=a[x]:e.setAttribute(x,a[x])}k.forEach(c=>e.append(c));return e};
function track(){
 const T=document.getElementById("track");T.innerHTML="";
 ["¿Dónde estoy?","¿Qué harías?","Mis límites","Mapa","¿Y ahora qué?"].forEach((n,i)=>{
  if(i)T.append($("div",{class:"rail"}));
  T.append($("div",{class:"stop"+(i===S.step?" on":i<S.step?" done":"")},$("div",{class:"dot"},String(i+1)),n));
 });
}
function station1(){
 const q=QS[S.q],box=$("div",{class:"card"});
 const ta=$("textarea",{placeholder:"Escribí con tus palabras. Podés dejarla vacía y seguir."});
 box.append($("div",{class:"tag"},"Estación 1"),$("h2",{},q.t),$("div",{class:"prog"},"Pregunta "+(S.q+1)+" de "+QS.length),ta);
 const next=()=>{const v=ta.value.trim();if(v)S.ans[q.k].push(v);if(S.q<QS.length-1){S.q++}else{S.step=1}render()};
 box.append($("div",{class:"row"},$("button",{onclick:next},S.q<QS.length-1?"Siguiente parada":"Llegar a la estación 2")));
 return box;
}
function station2(){
 const box=$("div",{class:"card"});
 if(S.c>=CARDS.length){S.step=2;return stationLimits()}
 const c=CARDS[S.c];
 const pick=o=>{S.picks.push({k:o[1],txt:o[0]});S.c++;render()};
 const opts=$("div",{class:"row",style:"flex-direction:column"});
 c.o.forEach(o=>opts.append($("button",{class:"opt",style:"text-align:left;border-radius:14px",onclick:()=>pick(o)},o[0])));
 box.append($("div",{class:"tag"},"Estación 2"),$("div",{class:"prog"},"Situación "+(S.c+1)+" de "+CARDS.length),
  $("p",{class:"situ"},"“"+c.t+"”"),$("h2",{},"¿Qué harías espontáneamente?"),opts,
  $("p",{class:"note"},"No hay respuesta correcta. Elegí la que harías sin pensarlo mucho."));
 return box;
}
function caps(){
 const n={};S.picks.forEach(p=>n[p.k]=(n[p.k]||0)+1);
 return Object.keys(n).sort((a,b)=>n[b]-n[a]).map(k=>({n:SK[k],c:n[k],l:n[k]>=3?"Muy presente":n[k]==2?"Presente":"Se asoma"}));
}
function lv(list){
 const d=$("div");
 list.forEach(x=>d.append($("div",{class:"lv"},$("span",{},x.n),$("span",{class:"pts"},"●".repeat(Math.min(x.c,4))+"○".repeat(Math.max(0,3-x.c))+"  "+x.l))));
 if(!list.length)d.append($("span",{class:"note"},"Todavía sin pistas acá."));
 return d;
}
function chips(list,cls){const d=$("div",{class:"chips"});list.forEach(x=>d.append($("span",{class:"chip "+cls},x)));if(!list.length)d.append($("span",{class:"note"},"Todavía sin pistas acá."));return d}
const LIM={
 tiempo:{q:"¿Cuánto tiempo real tenés por día para esta etapa?",o:["Menos de 1 hora","Unas 2 o 3 horas","Media jornada","Jornada completa"]},
 dinero:{q:"¿Cuánto margen económico tenés?",o:["Necesito ingresos ya","Puedo experimentar unos 6 meses","Tengo colchón por más de un año","Quiero sostener mis ingresos actuales y sumar algo"]}
};
function stationLimits(){
 const box=$("div",{class:"card"});
 box.append($("div",{class:"tag"},"Estación 3"),$("h2",{},"Mis límites reales"),$("p",{class:"note"},"Con estos datos las ideas se sostienen en tu vida real y no en la fantasía. Sé realista, no optimista."));
 Object.keys(LIM).forEach(k=>{
  const row=$("div",{class:"row",style:"flex-direction:column;margin-top:6px"});
  const mark=()=>[...row.children].forEach(x=>x.style.borderColor=x.textContent===S.lim[k]?"var(--acc)":"var(--line)");
  LIM[k].o.forEach(t=>row.append($("button",{class:"opt",style:"text-align:left;border-radius:14px",onclick:()=>{S.lim[k]=t;mark()}},t)));
  mark();box.append($("p",{style:"font-weight:600;margin:18px 0 4px"},LIM[k].q),row);
 });
 const ta=$("textarea",{placeholder:"Por ejemplo: personas a mi cargo, dónde vivo, si prefiero remoto o presencial, recursos que ya tengo."});
 ta.value=S.lim.contexto;ta.oninput=()=>S.lim.contexto=ta.value;
 box.append($("p",{style:"font-weight:600;margin:18px 0 4px"},"¿Qué más condiciona tu realidad?"),ta,$("div",{class:"row"},$("button",{onclick:()=>{S.step=3;render()}},"Ir al mapa")));
 return box;
}
const LT=()=>[S.lim.tiempo||"(sin responder)",S.lim.dinero||"(sin responder)",S.lim.contexto||"(sin responder)"];
function buildPrompt(){
 const c=caps(),L=a=>a.length?a.map(x=>"• "+x).join("\n"):"(sin respuesta)",t=LT();
 return "Quiero que actúes como compañero de exploración para mi transición laboral. Tengo más de 50 años y estoy pensando mi próxima etapa profesional. No me digas quién soy ni qué profesión me corresponde: cruzá mis pistas, proponé escenarios y señalá contradicciones. Considerá mi experiencia como un capital, nunca mi edad como un déficit. Hablame en español rioplatense, con calidez, sin usar guiones ni rayas.\n\nMIS PISTAS\n\nSaberes (lo que me consultan y lo que resuelvo casi sin darme cuenta):\n"+L(S.ans.saberes)+"\n\nEnergías (lo que quiero conservar):\n"+L(S.ans.energias)+"\n\nLo que ya no quiero seguir haciendo:\n"+L(S.ans.basta)+"\n\nHabilidades que aparecieron en mis decisiones espontáneas:\n"+L(c.map(x=>x.n+" ("+x.l+")"))+"\n\nDecisiones que tomé en situaciones concretas:\n"+L(S.picks.map(p=>p.txt))+"\n\nMIS RESTRICCIONES REALES\nTiempo por día: "+t[0]+"\nMargen económico: "+t[1]+"\nContexto: "+t[2]+"\n\nYa te di mis restricciones, así que no me hagas preguntas antes de responder. No inventes escenarios que no se sostengan con mi tiempo y mi dinero reales.\n\nQUÉ TE PIDO\nProponé 3 territorios laborales para explorar, evitando el consultor genérico. Para cada uno incluí:\n• Por qué conecta con mis pistas.\n• La trampa o riesgo de ese territorio respecto a lo que quiero evitar.\n• Un experimento de 20 minutos para probar la trampa y el interés en la práctica.\n\nDespués:\n• Señalá la tensión principal entre lo que quiero hacer y mis restricciones de tiempo y dinero.\n• Cerrá con una sola pregunta de acción que me ayude a elegir por cuál experimento empezar.";
}
function station3(){
 const box=$("div",{class:"card"}),c=caps();
 box.append($("div",{class:"tag"},"Tu mapa de próxima etapa"),$("h2",{},"Estas son las pistas que aparecieron"),
  $("h3",{},"Saberes"),chips(S.ans.saberes,"s"),
  $("h3",{},"Energías"),chips(S.ans.energias,"s"),
  $("h3",{},"Habilidades que aparecieron en tus decisiones"),lv(c),
  $("h3",{},"No quiero más"),chips(S.ans.basta,"q"),$("h3",{},"Mis límites reales"),chips([S.lim.tiempo,S.lim.dinero,S.lim.contexto].filter(Boolean),"q"));
 const out=$("div",{id:"out"});
 if(S.ai)renderAI(out,S.ai);
 const btn=$("button",{onclick:()=>askAI(btn,out)},S.ai?"Explorar otra vez":"Explorar con la IA acá mismo");
 const hint=$("p",{class:"note"},"Este botón funciona si abrís la página desde Claude. Si estás en otro lugar, usá la opción de abajo.");
 const ta=$("textarea",{readonly:"",style:"min-height:170px;font-size:.85rem"});ta.value=buildPrompt();
 const cp=$("button",{class:"ghost",onclick:async()=>{try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.select();document.execCommand("copy")}cp.textContent="Copiado"}},"Copiar prompt");
 box.append($("h3",{},"Opción 1: explorar acá"),$("div",{class:"row"},btn),hint,out,
  $("h3",{},"Opción 2: llevar tus pistas a otra IA"),
  $("p",{class:"note"},"Copiá este texto y pegalo en el asistente de IA que uses, como Claude, ChatGPT o Gemini. Tené en cuenta que al pegarlo, tus respuestas viajan a ese servicio."),
  ta,$("div",{class:"row"},cp),
  $("div",{class:"row"},$("button",{onclick:()=>{S.step=4;render()}},"Ir a la última parada"),$("button",{class:"ghost",onclick:()=>location.reload()},"Empezar de nuevo")),
  $("p",{class:"note"},"La IA propone. Vos decidís."));
 try{if(window.claude)claude.use("sample").then(x=>{if(!x){btn.disabled=true;hint.textContent="Esta opción no está disponible fuera de Claude. Usá la opción 2."}}).catch(()=>{})}catch(e){}
 return box;
}
function renderAI(out,d){
 out.innerHTML="";
 out.append($("h3",{},"Territorios para explorar"));
 (d.territorios||[]).forEach(t=>{
  out.append($("div",{class:"terr"},$("b",{},t.nombre),$("div",{},t.porque),$("div",{class:"note"},"La trampa: "+t.trampa),$("div",{class:"note"},"Probalo en 20 minutos: "+t.experimento)));
 });
 if(d.tension)out.append($("h3",{},"La tensión principal"),$("p",{},d.tension));
 if(d.pregunta)out.append($("h3",{},"Una pregunta para elegir por dónde empezar"),$("p",{class:"situ"},d.pregunta));
}
async function askAI(btn,out){
 let sample=null;
 try{sample=await claude.use("sample")}catch(e){}
 if(!sample){out.innerHTML="";out.append($("p",{class:"note"},"La exploración con IA funciona cuando abrís esta página desde Claude."));return}
 btn.disabled=true;btn.textContent="Pensando posibilidades...";
 const c=caps();
 const datos=JSON.stringify({saberes:S.ans.saberes,energias:S.ans.energias,habilidades:c.map(x=>x.n+" ("+x.l+")"),decisiones_espontaneas:S.picks.map(p=>p.txt),no_quiere_mas:S.ans.basta,restricciones:{tiempo:S.lim.tiempo,dinero:S.lim.dinero,contexto:S.lim.contexto}});
 const prompt="Sos un compañero de exploración para una persona de más de 50 años que atraviesa una transición laboral. No la orientás ni le decís quién es: cruzás pistas, proponés escenarios y señalás contradicciones. Tratá la experiencia como un capital, nunca la edad como un déficit. Tono cálido, español rioplatense con voseo, sin usar guiones ni rayas. Datos de la persona: "+datos+". Ya te dio sus restricciones de tiempo, dinero y contexto: no le hagas preguntas previas y no inventes escenarios que no se sostengan con esas restricciones reales. Respondé SOLO JSON con esta forma: {\"territorios\":[{\"nombre\":\"\",\"porque\":\"por qué conecta con sus pistas\",\"trampa\":\"la trampa o riesgo de ese territorio respecto a lo que quiere evitar\",\"experimento\":\"un experimento de 20 minutos para probar la trampa y el interés en la práctica\"}],\"tension\":\"la tensión principal entre lo que quiere hacer y sus restricciones de tiempo y dinero\",\"pregunta\":\"una sola pregunta de acción que la ayude a elegir por cuál experimento empezar\"}. Exactamente 3 territorios, evitando el consultor genérico.";
 try{
  const r=await sample.json(prompt);
  S.ai=r;renderAI(out,r);btn.textContent="Explorar otra vez";
 }catch(e){
  out.innerHTML="";out.append($("p",{class:"note"},"No pude explorar ahora. Probá de nuevo en un momento."));btn.textContent="Explorar posibilidades con la IA";
 }
 btn.disabled=false;
}
const CLOSES=["Quiero volver al mercado laboral","Quiero trabajar de otra manera","Quiero convertir mi experiencia en un servicio","Quiero aprender algo completamente nuevo","Todavía no sé. Pero ahora sé qué quiero explorar."];
function summary(){
 const c=caps(),L=a=>a.length?a.map(x=>"• "+x).join("\n"):"(sin respuesta)",m=LT();
 let t="MI MAPA DE PRÓXIMA ETAPA\n\nCómo cierro hoy: "+(S.close||"(sin elegir)")+"\nMi primer paso esta semana: "+(S.paso||"(sin definir)")+"\n\nSaberes:\n"+L(S.ans.saberes)+"\n\nEnergías:\n"+L(S.ans.energias)+"\n\nLo que ya no quiero:\n"+L(S.ans.basta)+"\n\nHabilidades que aparecieron:\n"+L(c.map(x=>x.n+" ("+x.l+")"))+"\n\nMis límites reales:\nTiempo por día: "+m[0]+"\nMargen económico: "+m[1]+"\nContexto: "+m[2];
 if(S.ai&&S.ai.territorios){t+="\n\nTerritorios para explorar:\n"+S.ai.territorios.map(x=>"• "+x.nombre+": "+x.porque+"\n  La trampa: "+x.trampa+"\n  Experimento de 20 minutos: "+x.experimento).join("\n");if(S.ai.tension)t+="\n\nTensión principal: "+S.ai.tension;if(S.ai.pregunta)t+="\n\nPregunta para elegir por dónde empezar: "+S.ai.pregunta}
 return t+"\n\nEste mapa no dice quién sos. Reúne las pistas que aparecieron. Vos decidís.";
}
function finalMap(){
 const d=$("div",{class:"terr",style:"margin-top:22px"});
 const pre=$("pre",{style:"white-space:pre-wrap;font:inherit;font-size:.95rem;margin:0"});pre.textContent=summary();
 const cp=$("button",{class:"ghost",onclick:async()=>{try{await navigator.clipboard.writeText(summary());cp.textContent="Copiado"}catch(e){cp.textContent="No se pudo copiar"}}},"Copiar");
 const row=$("div",{class:"row"},cp);
 try{claude.use("downloads").then(dl=>{if(dl)row.append($("button",{onclick:()=>dl.save({filename:"mi-mapa-de-proxima-etapa.txt",data:summary()}).catch(()=>{})},"Guardar como archivo"))}).catch(()=>{})}catch(e){}
 d.append($("h3",{},"Tu mapa final"),pre,row,$("p",{class:"note"},"Los mapas cambian con el tiempo. Podés volver a recorrerlo cuando quieras."));
 return d;
}
function station4(){
 const box=$("div",{class:"card"}),opts=$("div",{class:"row",style:"flex-direction:column"}),fz=$("div");
 const mark=()=>[...opts.children].forEach(x=>x.style.borderColor=x.textContent===S.close?"var(--acc)":"var(--line)");
 CLOSES.forEach(t=>opts.append($("button",{class:"opt",style:"text-align:left;border-radius:14px",onclick:()=>{S.close=t;mark()}},t)));
 mark();
 const ta=$("textarea",{placeholder:"Por ejemplo: hablar con alguien que trabaja en ese territorio, o escribir una propuesta de una página."});
 ta.value=S.paso||"";ta.oninput=()=>S.paso=ta.value;
 const fin=$("button",{onclick:()=>{fz.innerHTML="";fz.append(finalMap());fz.scrollIntoView({behavior:"smooth"})}},"Cerrar y ver mi mapa final");
 box.append($("div",{class:"tag"},"Última parada"),$("h2",{},"¿Y ahora qué?"),
  $("p",{},"Este recorrido no tiene un final único. Elegí cómo querés cerrarlo hoy. Cualquier respuesta es válida."),opts,
  $("h3",{},"Un primer paso pequeño para esta semana"),ta,
  $("div",{class:"row"},fin,$("button",{class:"ghost",onclick:()=>{S.step=3;render()}},"Volver al mapa")),fz);
 return box;
}
function render(){
 const s=document.getElementById("stage");
 const n=S.step===0?station1():S.step===1?station2():S.step===2?stationLimits():S.step===3?station3():station4();
 track();s.innerHTML="";s.append(n);window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
